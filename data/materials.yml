      list: "US Commerce BIS"
    narrative:
      significance: "China's largest semiconductor equipment maker, formed from the restructuring of Beijing Sevenstar Electronics and North Microelectronics — added to the US Entity List in the December 2024 action that named 140 Chinese semiconductor firms. H1 2026 revenue reached ¥20.161 billion (+24.9% year-on-year) with net profit of ¥3.37 billion (+5.05%), driven by rising market share in etch and deposition tools."
      what_it_supplies: "Etch systems, deposition tools (CVD and PVD), thermal processing equipment, and wafer cleaning systems — alongside NAURA, AMEC, and Piotech helped raise China's global deposition-tool market share from roughly 2% to 7% between 2019 and 2024."
