  - id: smee
    name_en: "SMEE (Shanghai Micro Electronics Equipment)"
    name_zh: "上海微电子装备（集团）股份有限公司"
    name_pinyin: "Shànghǎi Wēi Diànzǐ Zhuāngbèi (Jítuán) Gǔfèn Yǒuxiàn Gōngsī"
    category: "Equipment"
    segment: "Lithography"
    node_capability: "90nm-class confirmed in volume production (SSA600 scanner); a 28nm lithography claim surfaced via a shareholder social-media post in December 2023 but was later removed and is treated here as unverified"
    founded: 2002
    hq: {city: "Shanghai", lat: 31.21, lon: 121.61}
    entity_list:
      status: true
      date_added: "2022-12-15"
      list: "US Commerce BIS"
    narrative:
      significance: "China's only domestic lithography scanner maker of consequence — the single most consequential equipment chokepoint firm in this tracker, since lithography (not etch or deposition) is the tool class export controls target hardest."
      what_it_supplies: "Photolithography scanners (the SSA600 series, 90nm-class) and related mask-inspection tools."
    sources:
