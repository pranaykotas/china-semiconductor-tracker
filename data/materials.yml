      significance: "China-based subsidiary of NASDAQ-listed ACM Research — its Shanghai and Korea units were both added to the Entity List in the same December 2024 action that named Naura, illustrating how a dual-listed structure doesn't shield the China-based operating unit. 2025 full-year revenue reached ¥6.786 billion (+20.8% YoY) with net profit of ¥1.396 billion (+21.1% YoY); 2026 guidance was raised to $1.125-1.175 billion in revenue (+25-30% YoY), with management citing electroplating (ECP) demand and H1 2026 order growth of 105% year-on-year, concentrated in advanced packaging."
      what_it_supplies: "Wafer cleaning systems, electrochemical plating (ECP) tools, PECVD deposition, furnace, and track platforms — several adjacent front-end process categories beyond its original cleaning-tool business."
