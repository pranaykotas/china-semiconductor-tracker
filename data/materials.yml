# China Equipment & Materials Firm Tracker — Source of Truth
# Phase 1: five chokepoint firms across equipment and wafer/substrate categories
#
# Category values: Equipment | Materials | Wafer/Substrate
# Segment values (free text, may combine): Lithography | Etch | Deposition | CMP | Photoresist | Specialty Gas | Wafers

materials_firms:
  - id: naura-technology
    name_en: "Naura Technology"
    name_zh: "北方华创"
    name_pinyin: "Běifāng Huáchuàng"
    category: "Equipment"
    segment: "Etch, Deposition, CMP"
    node_capability: "Advanced-node etch/deposition tools in volume use at SMIC and other mature-node fabs; not confirmed at leading-edge (sub-14nm) nodes"
    founded: 2001
    hq: {city: "Beijing", lat: 39.90, lon: 116.41}
    entity_list:
      status: true
      date_added: "2024-12-03"
      list: "US Commerce BIS"
    narrative:
      significance: "China's largest semiconductor equipment maker, formed from the restructuring of Beijing Sevenstar Electronics and North Microelectronics — added to the US Entity List in the December 2024 action that named 140 Chinese semiconductor firms."
      what_it_supplies: "Etch systems, deposition tools (CVD and PVD), thermal processing equipment, and wafer cleaning systems — alongside NAURA, AMEC, and Piotech helped raise China's global deposition-tool market share from roughly 2% to 7% between 2019 and 2024."
    sources:
      - url: "https://en.wikipedia.org/wiki/Naura_Technology"
        title: "Naura Technology (Wikipedia)"
        date: "2026-09-28"
      - url: "https://technode.com/2024/12/03/us-adds-140-chinese-semiconductor-firms-to-entity-list-targeting-key-equipment-makers/"
        title: "US adds 140 Chinese semiconductor firms to Entity List, targeting key equipment makers"
        date: "2024-12-03"

