    narrative:
      significance: "China's largest domestic semiconductor silicon wafer producer, founded December 2015 — announced a ¥13.2 billion ($1.82B) investment to roughly double its 300mm wafer capacity from about 600,000 to 1.2 million wafers per month. That expansion is ahead of its original pace: H1 2026 revenue grew 36.5% year-on-year with 300mm wafer shipment volume up over 90%, and combined Shanghai + Taiyuan 300mm capacity had already reached roughly 1 million wafers/month, with 1.2 million/month now targeted by end of 2026 rather than as a multi-year goal."
      what_it_supplies: "300mm (12-inch) semiconductor-grade silicon wafers and SOI (silicon-on-insulator) substrates — the base material every fab in this tracker depends on, regardless of the fab's own ownership category or node."
