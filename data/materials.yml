  - id: smee
    name_en: "SMEE (Shanghai Micro Electronics Equipment)"
    name_zh: "上海微电子装备（集团）股份有限公司"
    name_pinyin: "Shànghǎi Wēi Diànzǐ Zhuāngbèi (Jítuán) Gǔfèn Yǒuxiàn Gōngsī"
    category: "Equipment"
    segment: "Lithography"
    node_capability: "90nm-class in volume production since 2023 (SSA600 scanner). 28nm-class immersion DUV (SSA800 series) delivered to SMIC from May 2025, cleared full-process validation with wafer yields consistently above 90% by early 2026, and was publicly confirmed by China's Minister of Science and Technology in March 2026 to have entered mass-production delivery — a status upgrade from the unverified December 2023 claim this entry previously carried."
    founded: 2002
    hq: {city: "Shanghai", lat: 31.21, lon: 121.61}
    entity_list:
      status: true
      date_added: "2022-12-15"
      list: "US Commerce BIS"
    narrative:
      significance: "China's only domestic lithography scanner maker of consequence — the single most consequential equipment chokepoint firm in this tracker, since lithography (not etch or deposition) is the tool class export controls target hardest. The SSA800's confirmed move to mass-production delivery in 2026 is the clearest single data point in this entire tracker of China closing an advanced-lithography gap that export controls were specifically designed to hold open; by April 2026 the tool had been delivered in volume to both SMIC and Hua Hong, and 2026 output plans called for roughly 50 units (doubling year-on-year), with installed capacity reportedly exceeding 120 units."
      what_it_supplies: "Photolithography scanners — the SSA600 series (90nm-class, established volume product) and the newer SSA800 series (28nm-class immersion DUV, now in mass production) — plus related mask-inspection tools."
    sources:
      - url: "https://en.wikipedia.org/wiki/Shanghai_Micro_Electronics_Equipment"
        title: "Shanghai Micro Electronics Equipment (Wikipedia)"
        date: "2026-09-28"
      - url: "https://www.kharon.com/brief/semiconductors-lithography-smee-amies-technology-entity-list-export-controls"
        title: "The U.S. Restricted China's Chipmaking-Tech Champion. Its New Spinoff Is Another Story."
        date: "2026-09-28"
      - url: "https://zhuanlan.zhihu.com/p/2028184174327080121"
        title: "重新认识中国光刻机的突围：中国光刻机的真实现状与近一年重大进展（2025—2026） (Zhihu)"
        date: "2026-09-28"
      - url: "https://netbig.top/thread-89272-1-1.html"
        title: "中国首款可实现28nm制程的光刻设备于2026年4月官宣全面量产 (forum repost of official coverage)"
        date: "2026-09-28"

