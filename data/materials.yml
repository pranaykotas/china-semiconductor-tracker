      significance: "Founded by veteran semiconductor engineer Dr. Gerald Yin (尹志尧) in May 2004 — not on the US Entity List as of the sources checked for this tracker, notable given how central etch tools are to advanced-node manufacturing. H1 2026 revenue reached ¥6.691 billion (+34.9% year-on-year) with net profit of ¥2.825 billion, up roughly 300% year-on-year; the company reported several key etch processes for advanced logic and memory devices reaching mass production during the half, and a second Lingang, Shanghai facility was reportedly being planned."
      what_it_supplies: "Plasma etching systems (Capacitively Coupled Plasma and Inductively Coupled Plasma, under the Primo brand) and MOCVD deposition tools used in compound semiconductor and LED manufacturing."
