    narrative:
      significance: "China's only advanced 3D NAND producer at national/global scale — founded by Tsinghua Unigroup with $24B in state-linked investment, YMTC reached 128-layer 3D NAND with its own Xtacking architecture before being added to the US Entity List. Filed for a STAR Market IPO in August 2026, with sources disagreeing sharply on valuation — Caixin reported a potential valuation of at least ¥1 trillion ($148B), while other reporting cited a lower $23.6-44.2B range; this tracker states both rather than picking one."
      what_it_makes: "3D NAND flash memory chips using XTacking wafer-bonding architecture, plus packaged memory chips and SSDs."
      why_it_matters: "The clearest case of a Chinese chipmaker reaching a genuinely globally competitive memory technology (Xtacking) before US export controls specifically targeted it. BIS cited YMTC's NAND supply to Huawei, and YMTC's earlier addition to BIS's Unverified List without cooperating on an end-use check within the required window, as grounds for the December 2022 Entity List action — this was distinct from the 2023 Huawei Mate 60 Pro teardown, whose memory chips were later identified as SK Hynix parts, not YMTC's. Combined NAND capacity across YMTC's lines was reported around 300,000 wafers/month in 2026."
