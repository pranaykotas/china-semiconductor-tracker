project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!CLAUDE.md"
  # CSV/JSON downloads written by R/export_data.R; social cards are built by
  # R/generate_social_cards.R and must ship to _site for og:image URLs to
  # resolve (absolute-URL references do not trigger Quarto's asset copying).
  resources:
    - "downloads/*"
    - "data/boundaries/*"
    - "images/og-image.png"
    - "images/cards/*"
    - "images/favicon.svg"

website:
  title: "China Semiconductor Tracker"
  description: "Tracking semiconductor manufacturing, chip design, and equipment firms across mainland China"
  favicon: "images/favicon.svg"
  site-url: "https://fabs-china.pranaykotas.com"

  navbar:
    background: "#620d3c"
    foreground: "#ffffff"
    left:
      - text: "Map & Overview"
        href: index.qmd
      - text: "Trackers"
        menu:
          - text: "Timeline"
            href: timeline.qmd
          - text: "Technology Nodes"
            href: nodes.qmd
          - text: "Chip Design"
            href: design.qmd
          - text: "Equipment & Materials"
            href: equipment-materials.qmd
          - text: "US Designations"
            href: designations.qmd
          - text: "What Changed"
            href: changes.qmd
      - text: "Policy & Budget"
        href: budget.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Takshashila"
        href: https://takshashila.org.in
        aria-label: "Takshashila Institution"
      - icon: github
        href: https://github.com/pranaykotas/china-semiconductor-tracker
        aria-label: "GitHub repository"

  page-footer:
    left: |
      &copy; 2026 [Pranay Kotasthane](https://pranaykotas.com) · [Takshashila Institution](https://takshashila.org.in)
    center: |
      Part of the [Siliconpolitik Project](https://takshashila.org.in/pages/research-areas/focus-areas/siliconpolitik.html)
    right: |
      [Report an issue](https://github.com/pranaykotas/china-semiconductor-tracker/issues/new/choose) · [Send an update](mailto:pranay@takshashila.org.in?subject=China%20Semiconductor%20Tracker%20%E2%80%94%20update)

  search: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    mainfont: "Inter"
    monofont: "Roboto Mono"
    # Site-level social card; profile-page front matter overrides the image
    # with its entity-specific card.
    open-graph:
      image: "https://fabs-china.pranaykotas.com/images/og-image.png"
      site-name: "China Semiconductor Tracker"
    twitter-card:
      card: summary_large_image
      image: "https://fabs-china.pranaykotas.com/images/og-image.png"
