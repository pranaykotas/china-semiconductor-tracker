name: "Facility Update"
description: "Submit a status update, correction, or new facility"
title: "[Update]: "
labels: ["data-update"]
body:
  - type: markdown
    attributes:
      value: |
        Updates are reviewed against the tracker's sourcing standard and
        incorporated weekly. A source URL is required — Chinese-language
        sources (集微网, 财联社, 公司公告/交易所 filings, etc.) are welcome
        and often the fastest way to flag something.

  - type: dropdown
    id: facility
    attributes:
      label: Facility
      description: Which facility does this update relate to?
      options:
        - "SMIC Shanghai (Lingang) / Phase 2"
        - "SMIC Beijing (Jingcheng)"
        - "SMIC Tianjin (Xiqing)"
        - "SMIC Shenzhen"
        - "Hua Hong Wuxi (Fab9 / Phase 3)"
        - "HLMC Shanghai Huali (Fab 5 & 6)"
        - "Nexchip Hefei / Phase 4"
        - "YMTC Wuhan"
        - "CXMT Hefei"
        - "CXMT Shanghai (Pudong)"
        - "JHICC (Fujian Jinhua)"
        - "SiEn Qingdao"
        - "CanSemi (Guangzhou)"
        - "United Nova Technology (Shaoxing)"
        - "GTA Semiconductor (Shanghai Lingang)"
        - "CR Micro Chongqing (Runxi)"
        - "CR Micro Shenzhen (Runpeng)"
        - "Silan Microelectronics Xiamen Cluster"
        - "XMC Wuhan (Wuhan Xinxin)"
        - "SwaySure (Shenzhen)"
        - "Yandong Micro / Beidian Integration (Beijing)"
        - "Chipyear Era Xi'an"
        - "Innoscience Suzhou (GaN)"
        - "Hunan Sanan Semiconductor (Changsha SiC)"
        - "Anyi-Semic / ST-Sanan JV (Chongqing SiC)"
        - "YOFC Advanced Semiconductor (Wuhan SiC)"
        - "JCET Jiangyin (incl. Lingang projects)"
        - "Tongfu Microelectronics Nantong"
        - "Huatian Technology Tianshui"
        - "Intel Chengdu"
        - "Samsung Xi'an"
        - "SK Hynix Wuxi / Dalian"
        - "TSMC Nanjing / Shanghai"
        - "UMC Xiamen (United Semiconductor)"
        - "SITRI Shanghai (research fab)"
        - "Xi'an Optoelectronics Pilot Institute (XOPT)"
        - "NOEIC Wuhan (research fab)"
        - "SMIC South SPCL (Zhangjiang SN1/SN2 — advanced node)"
        - "SMIC Zhangjiang S1 (legacy 8-inch)"
        - "SMIC Beijing / NORIC 中芯北方"
        - "SMIC Tianjin (former Motorola 8-inch)"
        - "Hua Hong Wuxi Fab 7"
        - "Hua Hong Shanghai Fab 1/2/3 (8-inch)"
        - "TI Chengdu (200mm fab + back-end)"
        - "Hejian Suzhou (UMC 8-inch)"
        - "Worlds Semiconductor Chongqing"
        - "SK Hynix Chongqing (assembly/test)"
        - "Sanan IC (Xiamen/Quanzhou compound)"
        - "Hanking MEMS Fushun (Liaoning)"
        - "HSMC Wuhan (cancelled)"
        - "Decoma/Tacoma Huai'an–Nanjing (cancelled)"
        - "GlobalFoundries Chengdu (cancelled)"
        - "New facility (not yet tracked)"
    validations:
      required: true

  - type: dropdown
    id: update-type
    attributes:
      label: Update type
      options:
        - "Status change (e.g., construction started, line-out, operational)"
        - "Correction to existing data"
        - "New data point (investment, capacity, timeline, etc.)"
        - "New facility to add"
        - "Entity List / export-designation change"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the update. For new facilities, include as much as you know (company, location, type, investment, status, timeline).
      placeholder: "e.g., SMIC Lingang Phase 2 equipment move-in started in September 2026, first wafers expected Q1 2027..."
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: Link to a news article, press release, filing, or official document.
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: source-date
    attributes:
      label: Date of source
      description: When was this source published?
      placeholder: "YYYY-MM-DD"
    validations:
      required: false
